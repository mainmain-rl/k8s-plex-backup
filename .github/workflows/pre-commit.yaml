name: Pre-commit Checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v6

      - name: 🧰 Installation des outils via mise
        uses: jdx/mise-action@v4

      - name: 💾 Cache des environnements pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('mise.toml', '.pre-commit-config.yaml') }}

      - name: 🚀 Exécution de pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
